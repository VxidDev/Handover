server {
    # Listen on port 80. A TLS terminator (e.g. Cloudflare Flexible TLS) forwards decrypted traffic here.
    listen 80;
    server_name _;

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://handover-backend:8099;
        
        # Standard proxy headers so FastAPI sees the original host/proto correctly
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for /api/requests/{id}/chat
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived WS connections (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Disable buffering for SSE/WS if needed in the future
        proxy_buffering off;
    }
}