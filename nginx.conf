server {
    # Слушаем 80 порт. Cloudflare Flexible TLS отправляет сюда расшифрованный трафик.
    listen 80;
    server_name _;

    # Защита от чтения скрытых файлов
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://handover-backend:8099;
        
        # Стандартные заголовки для корректной работы FastAPI за прокси
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket для эндпоинта /api/requests/{id}/chat
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для долгоживущих WS-соединений (24 часа)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Отключаем буферизацию для SSE/WS если потребуется в будущем
        proxy_buffering off;
    }
}